name: Build My Budget Android App

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/mw/personalbudget/calculator

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyBudget"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'mw.personalbudget.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'mw.personalbudget.calculator'
                  minSdk 27
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="My Budget"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/mw/personalbudget/calculator/MainActivity.java <<'EOF'
          package mw.personalbudget.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.*;
          import java.text.NumberFormat;
          import java.util.Locale;

          public class MainActivity extends Activity {

              EditText amount, description;
              Spinner type;
              TextView balance, income, expenses, history;
              double totalIncome = 0;
              double totalExpenses = 0;
              String records = "";

              String format(double value) {
                  return "MWK " + NumberFormat.getNumberInstance(
                      Locale.US).format(value);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(24, 30, 24, 24);
                  layout.setBackgroundColor(Color.rgb(243,246,244));

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(layout);

                  TextView title = new TextView(this);
                  title.setText("MY BUDGET");
                  title.setTextSize(28);
                  title.setTextColor(Color.rgb(23,60,49));
                  title.setTypeface(null, 1);
                  layout.addView(title);

                  balance = new TextView(this);
                  balance.setTextSize(25);
                  balance.setTextColor(Color.WHITE);
                  balance.setPadding(20,25,20,25);
                  balance.setBackgroundColor(Color.rgb(23,79,64));
                  layout.addView(balance);

                  income = new TextView(this);
                  income.setTextSize(18);
                  income.setTextColor(Color.rgb(23,107,85));
                  layout.addView(income);

                  expenses = new TextView(this);
                  expenses.setTextSize(18);
                  expenses.setTextColor(Color.RED);
                  layout.addView(expenses);

                  TextView heading = new TextView(this);
                  heading.setText("Add transaction");
                  heading.setTextSize(21);
                  heading.setTextColor(Color.BLACK);
                  heading.setPadding(0,25,0,10);
                  layout.addView(heading);

                  amount = new EditText(this);
                  amount.setHint("Amount in MWK");
                  amount.setInputType(8194);
                  layout.addView(amount);

                  description = new EditText(this);
                  description.setHint("Description");
                  layout.addView(description);

                  type = new Spinner(this);
                  String[] choices = {"Income","Expense"};
                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(this,
                      android.R.layout.simple_spinner_item, choices);
                  adapter.setDropDownViewResource(
                      android.R.layout.simple_spinner_dropdown_item);
                  type.setAdapter(adapter);
                  layout.addView(type);

                  Button add = new Button(this);
                  add.setText("Add transaction");
                  layout.addView(add);

                  TextView recent = new TextView(this);
                  recent.setText("Recent transactions");
                  recent.setTextSize(21);
                  recent.setTextColor(Color.BLACK);
                  recent.setPadding(0,25,0,10);
                  layout.addView(recent);

                  history = new TextView(this);
                  history.setTextColor(Color.DKGRAY);
                  history.setTextSize(16);
                  layout.addView(history);

                  android.content.SharedPreferences prefs =
                      getSharedPreferences("budget", MODE_PRIVATE);
                  totalIncome = Double.longBitsToDouble(
                      prefs.getLong("income", 0));
                  totalExpenses = Double.longBitsToDouble(
                      prefs.getLong("expenses", 0));
                  records = prefs.getString("records", "");

                  update();

                  add.setOnClickListener(v -> {
                      String input = amount.getText().toString().trim();
                      if (input.isEmpty()) {
                          amount.setError("Enter an amount");
                          return;
                      }

                      double value;
                      try {
                          value = Double.parseDouble(input);
                      } catch (Exception e) {
                          amount.setError("Invalid amount");
                          return;
                      }

                      if (!Double.isFinite(value) ||
                          value <= 0 || value > 1.0e12) {
                          amount.setError("Enter a valid positive amount");
                          return;
                      }

                      String note = description.getText().toString().trim();
                      if (note.isEmpty()) note = "Transaction";

                      String selected = type.getSelectedItem().toString();

                      if (selected.equals("Income")) {
                          totalIncome += value;
                      } else {
                          totalExpenses += value;
                      }

                      records = note + " - " + selected + ": " +
                          format(value) + "\n" + records;

                      prefs.edit()
                          .putLong("income",
                              Double.doubleToLongBits(totalIncome))
                          .putLong("expenses",
                              Double.doubleToLongBits(totalExpenses))
                          .putString("records", records)
                          .apply();

                      amount.setText("");
                      description.setText("");
                      update();
                  });

                  setContentView(scroll);
              }

              void update() {
                  balance.setText("AVAILABLE BALANCE\n" +
                      format(totalIncome-totalExpenses));
                  income.setText("Income: " + format(totalIncome));
                  expenses.setText("Expenses: " + format(totalExpenses));
                  history.setText(records.isEmpty() ?
                      "No transactions yet." : records);
              }
          }
          EOF

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Budget-APK
          path: app/build/outputs/apk/debug/app-debug.apk